<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>تسجيل دخول المشرف</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary:#4f46e5; --primary-soft:#eef2ff; --primary-hover:#4338ca; --success:#16a34a; --danger:#dc2626; --bg:#f1f5f9; --card:#fff; --text:#0f172a; --gray:#64748b; --border:#e2e8f0; --input:#f8fafc; }
        @media (prefers-color-scheme: dark) {
            :root { --primary:#818cf8; --primary-soft:#1e1b4b; --primary-hover:#6366f1; --success:#4ade80; --danger:#f87171; --bg:#0b1020; --card:#151b2e; --text:#e5e7eb; --gray:#94a3b8; --border:#27304a; --input:#0f1424; }
        }
        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--text); margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px; font-size:16px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:20px; width:100%; max-width:400px; padding:32px 24px; box-shadow:0 12px 30px -14px rgba(15,23,42,.25); }
        .logo { width:64px; height:64px; margin:0 auto 14px; border-radius:20px; background:var(--primary-soft); display:grid; place-items:center; font-size:32px; }
        h2 { text-align:center; margin:0 0 24px; font-size:22px; }
        label { display:block; margin-bottom:6px; font-size:14px; color:var(--gray); font-weight:600; }
        .field { margin-bottom:16px; position:relative; }
        input { width:100%; min-height:52px; padding:12px 16px; font-size:16px; border-radius:14px; border:1.5px solid var(--border); background:var(--input); color:var(--text); outline:none; font-family:inherit; }
        input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
        .eye { position:absolute; left:6px; bottom:6px; width:40px; height:40px; min-height:0; margin:0; padding:0; background:transparent; font-size:18px; border-radius:10px; }
        button { width:100%; min-height:54px; margin-top:6px; font-size:17px; font-weight:800; border-radius:14px; border:none; background:var(--primary); color:#fff; cursor:pointer; font-family:inherit; }
        button:hover { background:var(--primary-hover); }
        button:active { transform:scale(.98); }
        button:disabled { opacity:.6; }
        #msg { margin-top:14px; font-size:14px; font-weight:700; text-align:center; min-height:20px; }
            /* ===== تحسين المظهر (طبقة تجميل) ===== */
        :root { --primary:#4338ca; --primary-2:#7c3aed; --accent:#06b6d4; --primary-soft:#eef0ff; --bg:#eef1f8; --radius:18px;
                --ring:0 0 0 4px rgba(99,102,241,.18); --lift:0 2px 4px rgba(15,23,42,.05), 0 18px 40px -18px rgba(67,56,202,.35); }
        @media (prefers-color-scheme: dark) { :root { --primary:#818cf8; --primary-2:#a78bfa; --accent:#22d3ee; --bg:#080c1a; --card:#121830; --input:#0c1126; --border:#232c4a;
                --ring:0 0 0 4px rgba(129,140,248,.22); --lift:0 2px 4px rgba(0,0,0,.4), 0 18px 40px -18px rgba(0,0,0,.7); } }
        html, body, button, input, select, textarea { font-family:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif; }
        body { background:
            radial-gradient(900px 420px at 85% -8%, rgba(124,58,237,.16), transparent 60%),
            radial-gradient(800px 380px at 0% 0%, rgba(6,182,212,.13), transparent 55%), var(--bg); background-attachment:fixed; letter-spacing:.1px; }
        .card { border:1px solid color-mix(in srgb, var(--border) 70%, transparent); border-radius:24px; box-shadow:var(--lift); animation:rise .45s cubic-bezier(.2,.8,.2,1) both; }
        @keyframes rise { from { opacity:0; transform:translateY(14px) scale(.985); } to { opacity:1; transform:none; } }
        .logo { width:76px; height:76px; border-radius:26px; background:linear-gradient(135deg,#4338ca,#7c3aed); box-shadow:0 12px 26px -10px var(--primary-2); font-size:36px; filter:none; }
        h1 { font-weight:800; letter-spacing:-.2px; }
        button { background:linear-gradient(135deg,#4338ca,#7c3aed); color:#fff; border-radius:16px; box-shadow:0 10px 22px -12px #7c3aed; transition:transform .12s ease, box-shadow .2s ease, filter .2s ease; }
        button:hover:not(:disabled) { filter:brightness(1.07); box-shadow:0 14px 28px -12px var(--primary-2); }
        button:active:not(:disabled) { transform:scale(.97); }
        .btn-ghost, button.ghost, .btn-ghost:hover { background:var(--input) !important; color:var(--text) !important; box-shadow:none !important; border:1.5px solid var(--border) !important; }
        .btn-success { background:linear-gradient(135deg,#16a34a,#10b981) !important; }
        .btn-danger { background:linear-gradient(135deg,#dc2626,#f43f5e) !important; }
        input[type=text], input[type=tel], input[type=email], input[type=password], input[type=search], input:not([type]), select, textarea { border-radius:14px; border:1.5px solid var(--border); transition:border-color .15s, box-shadow .15s, background .15s; }
        input:focus, select:focus, textarea:focus { outline:none; border-color:var(--primary) !important; box-shadow:var(--ring) !important; background:var(--card); }
        .info, .crs, .row { border-radius:16px; transition:transform .15s ease, box-shadow .15s ease, border-color .15s; }
        .crs:hover, .row:hover { border-color:color-mix(in srgb, var(--primary) 45%, var(--border)); box-shadow:0 10px 22px -16px var(--primary); transform:translateY(-1px); }
        .hint { background:linear-gradient(135deg,var(--primary-soft),color-mix(in srgb, var(--accent) 12%, var(--primary-soft))); border:1px solid color-mix(in srgb, var(--primary) 18%, transparent); }
        .lock { background:linear-gradient(135deg,var(--warning-soft),var(--primary-soft)); border:1px solid var(--border); }
        .bar { height:10px; border-radius:10px; } .bar i { background:linear-gradient(90deg,var(--success),var(--accent)); border-radius:10px; transition:width .7s cubic-bezier(.2,.8,.2,1); }
        .topbar { backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); background:color-mix(in srgb, var(--card) 82%, transparent); }
        .avatar { background:linear-gradient(135deg,#4338ca,#7c3aed); color:#fff; box-shadow:0 6px 14px -6px var(--primary-2); }
        .tab { border-radius:14px; transition:all .18s ease; }
        .tab.active, .tab.active * { color:#fff !important; } .tab.active { background:linear-gradient(135deg,#4338ca,#7c3aed); box-shadow:0 8px 18px -10px var(--primary-2); }
        .badge { border-radius:20px; }
        .big-ic { filter:drop-shadow(0 10px 18px rgba(0,0,0,.18)); }
        .spinner { border-top-color:var(--primary-2); }
        ::selection { background:color-mix(in srgb, var(--primary) 30%, transparent); }
        @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
    </style>
</head>
<body>

<form class="card" id="form" autocomplete="on">
    <div class="logo">🎓</div>
    <h2>لوحة تحكم المشرفين</h2>
    <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@mnu.edu.eg" autocomplete="username" inputmode="email" required>
    </div>
    <div class="field">
        <label for="password">كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye" aria-label="إظهار كلمة المرور">👁</button>
    </div>
    <button type="submit" id="login-btn">تسجيل الدخول</button>
    <p id="msg"></p>
</form>
<p style="text-align:center;font-size:13px;opacity:.7;margin:14px 0"><a href="https://github.com/gamalzakareya6-star/attendance/releases/latest/download/attendance-admin.apk">تطبيق المشرف لأندرويد</a></p>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR_8fKmcHa3KDxt4AIt2ZMQ59UDMrZlDE",
        authDomain: "mnu-attendance.firebaseapp.com",
        databaseURL: "https://mnu-attendance-default-rtdb.firebaseio.com",
        projectId: "mnu-attendance",
        storageBucket: "mnu-attendance.firebasestorage.app",
        messagingSenderId: "768022025822",
        appId: "1:768022025822:web:af7c6dc6a36bc07adf06cf",
        measurementId: "G-R955LS94GJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const btn = $('login-btn');
    let loggingIn = false;

    function show(text, ok) {
        $('msg').style.color = ok ? "var(--success)" : "var(--danger)";
        $('msg').textContent = text;
    }

    try { const e = localStorage.getItem('admin_email'); if (e) { $('email').value = e; $('password').focus(); } } catch (e) {}

    // لو كان المشرف مسجّلاً من قبل: ادخل مباشرة دون كتابة شيء
    onAuthStateChanged(auth, async (user) => {
        if (!user || user.isAnonymous || loggingIn) return;
        try {
            const snap = await getDoc(doc(db, "admins", user.uid));
            if (snap.exists()) window.location.replace("admin.html");
        } catch (e) { /* يبقى في صفحة الدخول */ }
    });

    $('eye').addEventListener('click', () => {
        const p = $('password');
        p.type = p.type === 'password' ? 'text' : 'password';
    });

    $('form').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const email = $('email').value.trim();
        const password = $('password').value;
        if (!email || !password) return show("أدخل البريد وكلمة المرور", false);

        loggingIn = true;
        btn.disabled = true;
        btn.textContent = "جاري الدخول...";
        show("", true);

        try {
            const cred = await signInWithEmailAndPassword(auth, email, password);
            const adminSnap = await getDoc(doc(db, "admins", cred.user.uid));
            if (!adminSnap.exists()) {
                await signOut(auth);
                show("هذا الحساب ليس لديه صلاحية مشرف.", false);
                loggingIn = false; btn.disabled = false; btn.textContent = "تسجيل الدخول";
                return;
            }

            try { localStorage.setItem('admin_email', email); } catch (e) {}
            show("تم الدخول ✓", true);

            // سجّل الدخول دون تعطيل التحويل أكثر من نصف ثانية
            const log = addDoc(collection(db, "admins", cred.user.uid, "logs"), { action: "تسجيل دخول", timestamp: serverTimestamp() }).catch(() => {});
            await Promise.race([log, new Promise(r => setTimeout(r, 500))]);
            window.location.replace("admin.html");

        } catch (error) {
            console.error(error);
            show("خطأ في البريد أو كلمة المرور", false);
            loggingIn = false; btn.disabled = false; btn.textContent = "تسجيل الدخول";
        }
    });
</script>

</body>
</html>
