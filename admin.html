<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>لوحة التحكم - إدارة الحضور</title>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
    <style>
        :root {
            --primary:#4f46e5; --primary-soft:#eef2ff; --primary-hover:#4338ca;
            --success:#16a34a; --success-soft:#dcfce7;
            --danger:#dc2626; --danger-soft:#fee2e2;
            --warning:#d97706; --warning-soft:#fef3c7;
            --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --gray:#64748b; --border:#e2e8f0; --input:#f8fafc;
            --shadow:0 1px 3px rgba(15,23,42,.08), 0 8px 24px -12px rgba(15,23,42,.12);
            --radius:16px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --primary:#818cf8; --primary-soft:#1e1b4b; --primary-hover:#6366f1;
                --success:#4ade80; --success-soft:#052e16;
                --danger:#f87171; --danger-soft:#450a0a;
                --warning:#fbbf24; --warning-soft:#451a03;
                --bg:#0b1020; --card:#151b2e; --text:#e5e7eb; --gray:#94a3b8; --border:#27304a; --input:#0f1424;
                --shadow:0 1px 3px rgba(0,0,0,.4);
            }
        }
        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html { scroll-behavior:smooth; }
        body { font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--text); margin:0; font-size:16px; line-height:1.5; }
        .hidden { display:none !important; }
        .muted { color:var(--gray); }

        /* ===== الشريط العلوي ===== */
        .topbar { position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--border); padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .brand { display:flex; align-items:center; gap:10px; min-width:0; }
        .avatar { width:40px; height:40px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-weight:700; flex:none; }
        .who-name { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:50vw; }
        .badge { display:inline-block; padding:1px 10px; border-radius:20px; font-size:12px; font-weight:700; background:var(--primary-soft); color:var(--primary); }
        .badge.super { background:var(--warning-soft); color:var(--warning); }

        /* ===== التبويبات ===== */
        .tabs { display:flex; gap:6px; padding:10px 16px; max-width:900px; margin:0 auto; overflow-x:auto; scrollbar-width:none; }
        .tabs::-webkit-scrollbar { display:none; }
        .tab { flex:none; display:flex; align-items:center; gap:6px; padding:10px 16px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--gray); font-size:15px; font-weight:600; cursor:pointer; width:auto; }
        .tab.active { background:var(--primary); border-color:var(--primary); color:#fff; }
        @media (max-width:700px) {
            .tabs { position:fixed; bottom:0; left:0; right:0; z-index:30; background:var(--card); border-top:1px solid var(--border); padding:8px 8px calc(8px + env(safe-area-inset-bottom)); max-width:none; justify-content:space-around; gap:2px; }
            .tab { flex-direction:column; gap:2px; border:none; background:transparent; padding:6px 10px; font-size:12px; border-radius:10px; flex:1; }
            .tab .ic { font-size:20px; }
            .tab.active { background:var(--primary-soft); color:var(--primary); }
            main { padding-bottom:90px !important; }
        }

        main { max-width:900px; margin:0 auto; padding:4px 16px 30px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:var(--shadow); }
        .card h3 { margin:0 0 14px; font-size:18px; }

        label { display:block; font-size:13px; color:var(--gray); font-weight:600; margin-bottom:6px; }
        input, select { width:100%; min-height:48px; padding:10px 14px; font-size:16px; border-radius:12px; border:1.5px solid var(--border); background:var(--input); color:var(--text); outline:none; margin-bottom:14px; font-family:inherit; }
        input:focus, select:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
        button { min-height:48px; padding:10px 18px; font-size:16px; font-weight:700; border-radius:12px; border:none; background:var(--primary); color:#fff; cursor:pointer; width:100%; font-family:inherit; transition:transform .06s, background .15s; }
        button:hover { background:var(--primary-hover); }
        button:active { transform:scale(.98); }
        button:disabled { opacity:.55; cursor:default; }
        .btn-ghost { background:var(--input); color:var(--text); border:1.5px solid var(--border); }
        .btn-ghost:hover { background:var(--primary-soft); }
        .btn-danger { background:var(--danger); color:#fff; }
        .btn-danger:hover { background:#b91c1c; }
        .btn-success { background:var(--success); color:#052e16; }
        .btn-success:hover { filter:brightness(.95); background:var(--success); }
        .btn-sm { width:auto; min-height:36px; padding:6px 12px; font-size:13px; border-radius:10px; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:560px) { .grid2 { grid-template-columns:1fr; gap:0; } }
        .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
        .btn-row button { flex:1; min-width:140px; }

        /* ===== QR ===== */
        #qr-card { text-align:center; }
        #qr-card.full { position:fixed; inset:0; z-index:100; margin:0; border-radius:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--card); overflow:auto; }
        .qr-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:8px; }
        .qr-subject { font-weight:700; font-size:18px; }
        .qr-box { display:inline-block; background:#fff; padding:14px; border-radius:16px; box-shadow:var(--shadow); line-height:0; }
        .qr-box canvas, .qr-box img { max-width:100%; height:auto !important; }
        .bar { height:8px; background:var(--border); border-radius:8px; overflow:hidden; margin:16px auto 6px; max-width:320px; width:100%; }
        .bar > i { display:block; height:100%; width:100%; background:var(--primary); transition:width 1s linear; border-radius:8px; }
        .count-pill { display:inline-flex; align-items:center; gap:8px; background:var(--success-soft); color:var(--success); padding:8px 18px; border-radius:30px; font-weight:800; font-size:18px; margin:10px 0 14px; }
        #qr-card.full .count-pill { font-size:28px; }
        #qr-card.full .qr-actions { display:none; }
        .qr-actions { display:flex; gap:10px; }
        .qr-actions button { flex:1; }

        /* ===== القوائم ===== */
        .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
        .toolbar input { margin:0; flex:1; min-width:160px; }
        .list { border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--card); }
        .row { display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); }
        .row:last-child { border-bottom:none; }
        .row:nth-child(even) { background:var(--input); }
        .row .n { color:var(--gray); font-size:13px; text-align:center; }
        .row .main { min-width:0; }
        .row .name { font-weight:700; overflow-wrap:anywhere; }
        .row .meta { font-size:12px; color:var(--gray); }
        .row .acts { display:flex; gap:6px; }
        .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; background:var(--warning-soft); color:var(--warning); font-weight:700; margin-inline-start:4px; }
        .tag.self { background:var(--primary-soft); color:var(--primary); }
        .empty { padding:28px 14px; text-align:center; color:var(--gray); }
        .skeleton { height:56px; background:linear-gradient(90deg,var(--input),var(--border),var(--input)); background-size:200% 100%; animation:sk 1.2s infinite; border-bottom:1px solid var(--card); }
        @keyframes sk { to { background-position:-200% 0; } }

        /* ===== إشعارات ===== */
        #toasts { position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; width:min(92vw,420px); pointer-events:none; }
        .toast { background:var(--text); color:var(--bg); padding:12px 16px; border-radius:12px; font-weight:600; font-size:15px; opacity:0; transform:translateY(-10px); transition:all .25s; box-shadow:var(--shadow); }
        .toast.show { opacity:1; transform:none; }
        .toast.ok { background:var(--success); color:#052e16; }
        .toast.err { background:var(--danger); color:#fff; }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="avatar" id="avatar">؟</div>
        <div style="min-width:0">
            <div class="who-name" id="who-name">...</div>
            <span class="badge" id="role-badge">...</span>
        </div>
    </div>
    <button class="btn-ghost btn-sm" id="logout-btn">خروج</button>
</header>

<nav class="tabs" id="tabs">
    <button class="tab active" data-tab="session"><span class="ic">🎯</span>جلسة</button>
    <button class="tab" data-tab="attendance"><span class="ic">📋</span>الحضور</button>
    <button class="tab" data-tab="profile"><span class="ic">👤</span>ملفي</button>
    <button class="tab hidden" data-tab="admins" id="tab-admins"><span class="ic">👥</span>المشرفون</button>
    <button class="tab" data-tab="logs"><span class="ic">🕘</span>السجل</button>
</nav>

<main>
    <!-- ===== جلسة ===== -->
    <section class="panel" data-panel="session">
        <div class="card" id="new-session-card">
            <h3>فتح جلسة حضور جديدة</h3>
            <label for="subject-name">اسم المحاضرة</label>
            <input type="text" id="subject-name" placeholder="مثال: كيمياء تحليلية" maxlength="80" autocomplete="off">
            <div class="grid2">
                <div>
                    <label for="session-spec">التخصص</label>
                    <select id="session-spec"></select>
                </div>
                <div>
                    <label for="refresh-select">تغيّر الـ QR كل (ثانية)</label>
                    <select id="refresh-select"></select>
                </div>
            </div>
            <button id="create-btn">بدء الجلسة</button>
        </div>

        <div class="card hidden" id="qr-card">
            <div class="qr-top">
                <span class="qr-subject" id="qr-subject"></span>
                <button class="btn-ghost btn-sm" id="full-btn">ملء الشاشة ⛶</button>
            </div>
            <div class="qr-box"><div id="qrcode"></div></div>
            <div class="bar"><i id="qr-bar"></i></div>
            <div class="muted" id="timer-display" style="font-size:14px;"></div>
            <div class="count-pill">✅ حضر: <span id="live-count">0</span></div>
            <div class="qr-actions">
                <button class="btn-ghost" id="hide-qr-btn">إخفاء</button>
                <button class="btn-danger" id="close-btn">إغلاق الجلسة</button>
            </div>
        </div>
    </section>

    <!-- ===== الحضور ===== -->
    <section class="panel hidden" data-panel="attendance">
        <div class="card">
            <h3>سجل الحضور</h3>
            <select id="session-selector"><option value="">-- اختر جلسة --</option></select>

            <div id="session-tools" class="hidden">
                <div class="btn-row">
                    <button id="resume-btn" class="btn-ghost hidden">🔳 عرض الـ QR</button>
                    <button id="export-btn" class="btn-success">⬇ تصدير Excel</button>
                    <button id="delete-session-btn" class="btn-danger hidden">🗑 حذف الجلسة</button>
                </div>

                <label for="manual-name">إضافة طالب يدويًا</label>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="manual-name" placeholder="اسم الطالب" maxlength="80" autocomplete="off" style="margin-bottom:0">
                    <button id="manual-add-btn" style="width:auto; flex:none;">إضافة</button>
                </div>

                <div class="toolbar" style="margin-top:16px;">
                    <input type="search" id="att-search" placeholder="🔍 بحث في الأسماء">
                    <span class="badge" style="font-size:14px; padding:6px 14px;">العدد: <b id="att-count">0</b></span>
                </div>
            </div>

            <div class="list" id="attendance-list">
                <div class="empty">اختر جلسة لعرض الحضور</div>
            </div>
        </div>
    </section>

    <!-- ===== ملفي ===== -->
    <section class="panel hidden" data-panel="profile">
        <div class="card">
            <h3>ملفي الشخصي</h3>
            <div class="grid2">
                <div>
                    <label for="profile-name">الاسم</label>
                    <input type="text" id="profile-name" maxlength="60">
                </div>
                <div>
                    <label for="profile-spec">تخصصي</label>
                    <select id="profile-spec"></select>
                </div>
            </div>
            <button id="save-profile-btn">حفظ</button>
        </div>
    </section>

    <!-- ===== المشرفون (مشرف عام) ===== -->
    <section class="panel hidden" data-panel="admins">
        <div class="card">
            <h3>إضافة مشرف</h3>
            <div class="grid2">
                <div><label for="new-admin-name">الاسم</label><input type="text" id="new-admin-name" maxlength="60" autocomplete="off"></div>
                <div><label for="new-admin-email">البريد الإلكتروني</label><input type="email" id="new-admin-email" autocomplete="off"></div>
                <div><label for="new-admin-pass">كلمة المرور (6 أحرف فأكثر)</label><input type="password" id="new-admin-pass" autocomplete="new-password"></div>
                <div><label for="new-admin-spec">التخصص</label><select id="new-admin-spec"></select></div>
            </div>
            <label for="new-admin-role">الصلاحية</label>
            <select id="new-admin-role">
                <option value="admin">مشرف عادي</option>
                <option value="super">مشرف عام</option>
            </select>
            <button id="add-admin-btn">إنشاء الحساب</button>
        </div>
        <div class="card">
            <h3>المشرفون الحاليون</h3>
            <div class="list" id="admins-list"><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
    </section>

    <!-- ===== السجل ===== -->
    <section class="panel hidden" data-panel="logs">
        <div class="card">
            <h3 id="logs-title">سجل نشاطي</h3>
            <div class="list" id="logs-list"><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
    </section>
</main>

<div id="toasts"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDoc, getDocs, setDoc, deleteDoc, writeBatch, query, where, orderBy, limit, onSnapshot, updateDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR_8fKmcHa3KDxt4AIt2ZMQ59UDMrZlDE",
        authDomain: "mnu-attendance.firebaseapp.com",
        databaseURL: "https://mnu-attendance-default-rtdb.firebaseio.com",
        projectId: "mnu-attendance",
        storageBucket: "mnu-attendance.firebasestorage.app",
        messagingSenderId: "768022025822",
        appId: "1:768022025822:web:af7c6dc6a36bc07adf06cf",
        measurementId: "G-R955LS94GJ"
    };

    // ===== إعدادات يمكنك تعديلها =====
    const REFRESH_OPTIONS = [5, 10, 15, 20, 30, 40, 50, 60];
    const SPECIALIZATIONS = [
        "علم الحيوان", "علم النبات", "الكيمياء", "الفيزياء", "الجيولوجيا",
        "الرياضيات البحتة وعلوم الحاسب", "الكيمياء الحيوية", "علم الحشرات",
        "الميكروبيولوجي", "أخرى"
    ];
    const GRACE_SECONDS = 20;
    const SESSION_MINUTES = 45;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);

    let me = null, isSuper = false;
    let qrInterval = null, timerInterval = null, rotating = false;
    let unsubscribeAttendance = null;
    let viewedSessionId = null;
    let attRows = [];
    let viewedLogsUid = null, logsDirty = true, adminsLoaded = false, sessionsLoaded = false;
    let wakeLock = null;
    const qr = { sessionId:null, token:null, refresh:20, timeLeft:0, full:false, subject:'' };
    const sessionsCache = new Map();

    // ---------- أدوات ----------
    function toast(msg, type) {
        const t = document.createElement('div');
        t.className = 'toast ' + (type || '');
        t.textContent = msg;
        $('toasts').appendChild(t);
        requestAnimationFrame(() => t.classList.add('show'));
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3200);
    }

    async function busy(btn, fn) {
        btn.disabled = true;
        try { return await fn(); } finally { btn.disabled = false; }
    }

    function fillSelect(sel, values, selected) {
        const frag = document.createDocumentFragment();
        values.forEach(v => {
            const o = document.createElement('option');
            o.value = v; o.textContent = v;
            if (v === selected) o.selected = true;
            frag.appendChild(o);
        });
        sel.replaceChildren(frag);
    }

    function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function smallBtn(text, cls, onClick) {
        const b = el('button', 'btn-sm ' + (cls || 'btn-ghost'), text);
        b.addEventListener('click', onClick);
        return b;
    }

    function setEmpty(box, text) { box.replaceChildren(el('div', 'empty', text)); }

    function toDate(ts) { return !ts ? null : (ts.toDate ? ts.toDate() : new Date(ts)); }
    function fmtTime(ts) { const d = toDate(ts); return d ? d.toLocaleString('ar-EG', { dateStyle:'short', timeStyle:'short' }) : '...'; }

    function newToken() {
        const a = new Uint32Array(3);
        crypto.getRandomValues(a);
        return Array.from(a, n => n.toString(36)).join('').slice(0, 12);
    }

    function logAction(action, sessionId) {
        const data = { action, timestamp: serverTimestamp() };
        if (sessionId) data.sessionId = sessionId;
        logsDirty = true;
        addDoc(collection(db, "admins", me.uid, "logs"), data).catch(e => console.warn("log failed", e));
    }

    // ---------- التبويبات ----------
    function setTab(name) {
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
        document.querySelectorAll('.panel').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== name));
        try { sessionStorage.setItem('tab', name); } catch (e) {}
        if (name === 'attendance' && !sessionsLoaded) loadSessionsList();
        if (name === 'admins' && isSuper && !adminsLoaded) { adminsLoaded = true; loadAdmins(); }
        if (name === 'logs' && (logsDirty || viewedLogsUid !== me.uid)) loadLogs(viewedLogsUid || me.uid, viewedLogsUid && viewedLogsUid !== me.uid ? $('logs-title').dataset.label : '');
        window.scrollTo({ top:0 });
    }

    // ---------- الدخول ----------
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        try {
            const snap = await getDoc(doc(db, "admins", user.uid));
            if (!snap.exists()) { await signOut(auth); window.location.href = "index.html"; return; }
            me = { uid:user.uid, email:user.email, ...snap.data() };
            isSuper = me.role === 'super';
            initUI();
        } catch (e) {
            console.error(e);
            window.location.href = "index.html";
        }
    });

    function initUI() {
        const display = me.name || me.email || '';
        $('who-name').textContent = display;
        $('avatar').textContent = (display.trim()[0] || '؟').toUpperCase();
        const badge = $('role-badge');
        badge.textContent = isSuper ? 'مشرف عام' : 'مشرف';
        badge.classList.toggle('super', isSuper);

        $('profile-name').value = me.name || '';
        fillSelect($('profile-spec'), SPECIALIZATIONS, me.specialization);
        fillSelect($('session-spec'), SPECIALIZATIONS, me.specialization);
        fillSelect($('new-admin-spec'), SPECIALIZATIONS);
        fillSelect($('refresh-select'), REFRESH_OPTIONS.map(String), '20');

        if (isSuper) $('tab-admins').classList.remove('hidden');

        let tab = 'session';
        try { tab = sessionStorage.getItem('tab') || 'session'; } catch (e) {}
        if (tab === 'admins' && !isSuper) tab = 'session';
        setTab(tab);
        // تحميل الجلسات في الخلفية دون تعطيل الواجهة
        loadSessionsList();
    }

    async function logoutAdmin() {
        stopQR();
        if (unsubscribeAttendance) unsubscribeAttendance();
        await signOut(auth);
        window.location.href = "index.html";
    }

    // ---------- الملف الشخصي ----------
    async function saveProfile() {
        const name = $('profile-name').value.trim();
        const specialization = $('profile-spec').value;
        if (!name) return toast("اكتب اسمك", "err");
        await busy($('save-profile-btn'), async () => {
            try {
                await updateDoc(doc(db, "admins", me.uid), { name, specialization });
                me.name = name; me.specialization = specialization;
                $('who-name').textContent = name;
                $('avatar').textContent = name[0].toUpperCase();
                $('session-spec').value = specialization;
                toast("تم الحفظ ✓", "ok");
            } catch (e) { console.error(e); toast("تعذّر الحفظ", "err"); }
        });
    }

    // ---------- QR ----------
    function qrSize() {
        return qr.full ? Math.floor(Math.min(innerWidth, innerHeight) * 0.6) : Math.min(260, Math.floor(innerWidth * 0.68));
    }

    function drawQR() {
        if (!qr.token || typeof QRCode === 'undefined') return;
        const base = window.location.href.split('?')[0].replace(/[^/]*$/, '');
        const url = `${base}student.html?session=${encodeURIComponent(qr.sessionId)}&token=${encodeURIComponent(qr.token)}`;
        const box = $('qrcode');
        box.innerHTML = "";
        const s = qrSize();
        new QRCode(box, { text:url, width:s, height:s, correctLevel: QRCode.CorrectLevel ? QRCode.CorrectLevel.M : undefined });
    }

    function stopQR() {
        if (qrInterval) clearInterval(qrInterval);
        if (timerInterval) clearInterval(timerInterval);
        qrInterval = timerInterval = null;
        releaseAwake();
    }

    async function keepAwake() {
        try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
    }
    function releaseAwake() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

    function tick() {
        qr.timeLeft = Math.max(0, qr.timeLeft - 1);
        $('timer-display').textContent = `يتغير الرمز خلال ${qr.timeLeft} ثانية`;
        $('qr-bar').style.width = (qr.timeLeft / qr.refresh * 100) + '%';
    }

    async function startDynamicQR(sessionId, refreshSec, subject) {
        stopQR();
        Object.assign(qr, { sessionId, refresh:refreshSec, subject, timeLeft:refreshSec });
        const keep = Math.ceil(GRACE_SECONDS / refreshSec) + 1;
        let tokens = [];
        const codeRef = doc(db, "sessions", sessionId, "private", "code");

        async function rotate() {
            if (rotating) return;
            rotating = true;
            try {
                const t = newToken();
                const next = [...tokens, t].slice(-keep);
                await setDoc(codeRef, { current:t, valid:next });
                tokens = next;
                qr.token = t;
                qr.timeLeft = refreshSec;
                $('qr-bar').style.transition = 'none';
                $('qr-bar').style.width = '100%';
                requestAnimationFrame(() => { $('qr-bar').style.transition = ''; });
                drawQR();
            } finally { rotating = false; }
        }
        qr.rotate = rotate;

        $('qr-subject').textContent = subject;
        $('qr-card').classList.remove('hidden');
        $('new-session-card').classList.add('hidden');

        await rotate();   // الأول: إن فشل يظهر الخطأ لمن استدعى الدالة
        keepAwake();

        qrInterval = setInterval(() => { rotate().catch(e => console.error("token update failed", e)); }, refreshSec * 1000);
        timerInterval = setInterval(tick, 1000);
    }

    function hideQR() {
        stopQR();
        qr.sessionId = null;
        qr.full = false;
        $('qr-card').classList.remove('full');
        $('qr-card').classList.add('hidden');
        $('new-session-card').classList.remove('hidden');
        $('qrcode').innerHTML = "";
        refreshResumeBtn();
    }

    function toggleFull() {
        qr.full = !qr.full;
        $('qr-card').classList.toggle('full', qr.full);
        $('full-btn').textContent = qr.full ? 'رجوع ✕' : 'ملء الشاشة ⛶';
        drawQR();
    }

    // المتصفح يبطئ المؤقتات في الخلفية: حدّث فور العودة
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && qr.sessionId && qr.rotate) {
            qr.rotate().catch(() => {});
            keepAwake();
        }
    });
    window.addEventListener('resize', () => { if (qr.sessionId) drawQR(); });

    // ---------- الجلسات ----------
    function renderSessionSelector() {
        const keep = $('session-selector').value;
        const frag = document.createDocumentFragment();
        const first = el('option', '', '-- اختر جلسة --'); first.value = "";
        frag.appendChild(first);
        [...sessionsCache.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).forEach(s => {
            const o = el('option');
            o.value = s.id;
            let label = s.subject;
            if (s.specialization) label += ` — ${s.specialization}`;
            label += ` (${new Date(s.createdAt).toLocaleDateString('ar-EG')})`;
            if (isSuper && s.createdByName) label += ` — ${s.createdByName}`;
            o.textContent = label;
            frag.appendChild(o);
        });
        $('session-selector').replaceChildren(frag);
        $('session-selector').value = sessionsCache.has(keep) ? keep : "";
    }

    async function loadSessionsList() {
        try {
            const q = isSuper
                ? query(collection(db, "sessions"), limit(200))
                : query(collection(db, "sessions"), where("createdBy", "==", me.uid), limit(200));
            const snap = await getDocs(q);
            sessionsCache.clear();
            snap.forEach(d => sessionsCache.set(d.id, { id:d.id, ...d.data() }));
            sessionsLoaded = true;
            renderSessionSelector();
        } catch (e) { console.error(e); toast("تعذّر تحميل الجلسات", "err"); }
    }

    async function createSession() {
        const subject = $('subject-name').value.trim();
        if (!subject) return toast("اكتب اسم المحاضرة", "err");
        const refreshSeconds = Number($('refresh-select').value);
        const specialization = $('session-spec').value;

        await busy($('create-btn'), async () => {
            try {
                const now = Date.now();
                const data = {
                    subject, specialization, createdBy:me.uid, createdByName:me.name || me.email,
                    createdAt:now, expiresAt:now + SESSION_MINUTES * 60 * 1000, active:true, refreshSeconds
                };
                const ref = await addDoc(collection(db, "sessions"), data);
                sessionsCache.set(ref.id, { id:ref.id, ...data });
                await startDynamicQR(ref.id, refreshSeconds, subject);
                logAction(`فتح جلسة: ${subject}`, ref.id);

                renderSessionSelector();
                $('session-selector').value = ref.id;
                onSessionChange();
                $('subject-name').value = "";
            } catch (e) {
                console.error(e);
                toast("تعذّر إنشاء الجلسة. تأكد من نشر القواعد ووجود مستندك في admins", "err");
            }
        });
    }

    async function closeSession() {
        if (!qr.sessionId) return;
        if (!confirm("إغلاق الجلسة نهائياً؟")) return;
        const sid = qr.sessionId;
        try {
            await updateDoc(doc(db, "sessions", sid), { active:false });
            const s = sessionsCache.get(sid); if (s) s.active = false;
            logAction("إغلاق جلسة", sid);
            hideQR();
            onSessionChange();
            toast("تم إغلاق الجلسة", "ok");
        } catch (e) { console.error(e); toast("تعذّر الإغلاق", "err"); }
    }

    function isLive(s) { return s && s.active && Date.now() < s.expiresAt; }

    function refreshResumeBtn() {
        const s = sessionsCache.get(viewedSessionId);
        $('resume-btn').classList.toggle('hidden', !(isLive(s) && qr.sessionId !== viewedSessionId));
    }

    async function resumeQR() {
        const s = sessionsCache.get(viewedSessionId);
        if (!s) return;
        await busy($('resume-btn'), async () => {
            try {
                await startDynamicQR(s.id, s.refreshSeconds || 20, s.subject);
                setTab('session');
            } catch (e) { console.error(e); toast("تعذّر تشغيل الـ QR", "err"); }
        });
    }

    // ---------- الحضور ----------
    function onSessionChange() {
        viewedSessionId = $('session-selector').value || null;
        $('session-tools').classList.toggle('hidden', !viewedSessionId);
        $('delete-session-btn').classList.toggle('hidden', !isSuper);
        refreshResumeBtn();
        loadAttendance();
    }

    function setCounts(n) {
        $('att-count').textContent = n;
        if (qr.sessionId && qr.sessionId === viewedSessionId) $('live-count').textContent = n;
    }

    function renderAttendance() {
        const box = $('attendance-list');
        const term = $('att-search').value.trim().toLowerCase();
        const rows = term ? attRows.filter(r => r.studentName.toLowerCase().includes(term)) : attRows;
        if (!rows.length) { setEmpty(box, attRows.length ? "لا نتائج" : "لا يوجد حضور حتى الآن"); return; }

        const frag = document.createDocumentFragment();
        rows.forEach((att) => {
            const row = el('div', 'row');
            row.appendChild(el('div', 'n', att.idx));
            const main = el('div', 'main');
            const name = el('div', 'name', att.studentName);
            name.appendChild(el('span', 'tag' + (att.manual ? '' : ' self'), att.manual ? 'يدوي' : 'ذاتي'));
            main.appendChild(name);
            main.appendChild(el('div', 'meta', fmtTime(att.timestamp)));
            row.appendChild(main);

            const acts = el('div', 'acts');
            if (isSuper) acts.appendChild(smallBtn("تعديل", "btn-ghost", () => editAttendance(att)));
            acts.appendChild(smallBtn("حذف", "btn-danger", () => deleteAttendance(att)));
            row.appendChild(acts);
            frag.appendChild(row);
        });
        box.replaceChildren(frag);
    }

    function loadAttendance() {
        if (unsubscribeAttendance) { unsubscribeAttendance(); unsubscribeAttendance = null; }
        attRows = [];
        setCounts(0);
        const box = $('attendance-list');
        if (!viewedSessionId) { setEmpty(box, "اختر جلسة لعرض الحضور"); return; }

        box.replaceChildren(el('div', 'skeleton'), el('div', 'skeleton'));
        const sid = viewedSessionId;
        unsubscribeAttendance = onSnapshot(query(collection(db, "attendance"), where("sessionId", "==", sid)), (snapshot) => {
            attRows = snapshot.docs
                .map(d => ({ id:d.id, ...d.data({ serverTimestamps:'estimate' }) }))
                .sort((a, b) => (toDate(a.timestamp)?.getTime() ?? 0) - (toDate(b.timestamp)?.getTime() ?? 0))
                .map((r, i) => ({ ...r, idx:i + 1 }));
            setCounts(attRows.length);
            renderAttendance();
        }, (err) => { console.error(err); setEmpty(box, "تعذّر تحميل الحضور (تحقق من صلاحياتك)"); });
    }

    async function deleteAttendance(att) {
        if (!confirm(`حذف حضور: ${att.studentName}؟`)) return;
        try {
            await deleteDoc(doc(db, "attendance", att.id));
            logAction(`حذف حضور: ${att.studentName}`, att.sessionId);
        } catch (e) { console.error(e); toast("تعذّر الحذف", "err"); }
    }

    async function editAttendance(att) {
        const name = prompt("الاسم الجديد:", att.studentName);
        if (name === null) return;
        const clean = name.trim().replace(/\s+/g, ' ');
        if (clean.length < 2) return toast("الاسم قصير", "err");
        try {
            await updateDoc(doc(db, "attendance", att.id), { studentName:clean });
            logAction(`تعديل اسم: ${att.studentName} ← ${clean}`, att.sessionId);
        } catch (e) { console.error(e); toast("تعذّر التعديل", "err"); }
    }

    async function addManual() {
        if (!viewedSessionId) return;
        const name = $('manual-name').value.trim().replace(/\s+/g, ' ');
        if (name.length < 2) return toast("اكتب اسم الطالب", "err");
        const id = `${viewedSessionId}_manual_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
        $('manual-name').value = "";   // تفريغ فوري لسرعة الإدخال المتتالي
        $('manual-name').focus();
        try {
            await setDoc(doc(db, "attendance", id), {
                sessionId:viewedSessionId, studentName:name, timestamp:serverTimestamp(), manual:true, addedBy:me.uid
            });
            logAction(`إضافة يدوية: ${name}`, viewedSessionId);
        } catch (e) { console.error(e); toast("تعذّرت إضافة: " + name, "err"); }
    }

    async function deleteSession() {
        if (!isSuper || !viewedSessionId) return;
        const sid = viewedSessionId;
        const s = sessionsCache.get(sid);
        if (!confirm(`حذف الجلسة "${s ? s.subject : ''}" وكل سجلات حضورها نهائياً؟`)) return;
        await busy($('delete-session-btn'), async () => {
            try {
                if (qr.sessionId === sid) hideQR();
                const att = await getDocs(query(collection(db, "attendance"), where("sessionId", "==", sid)));
                for (let i = 0; i < att.docs.length; i += 400) {
                    const b = writeBatch(db);
                    att.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
                    await b.commit();
                }
                await deleteDoc(doc(db, "sessions", sid, "private", "code")).catch(() => {});
                await deleteDoc(doc(db, "sessions", sid));
                logAction(`حذف جلسة: ${s ? s.subject : sid}`);
                sessionsCache.delete(sid);
                renderSessionSelector();
                onSessionChange();
                toast("تم حذف الجلسة", "ok");
            } catch (e) { console.error(e); toast("تعذّر حذف الجلسة بالكامل", "err"); }
        });
    }

    function csvSafe(value) {
        let s = String(value).replace(/"/g, '""');
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
        return `"${s}"`;
    }

    function exportToExcel() {
        if (!attRows.length) return toast("لا توجد بيانات لتصديرها", "err");
        const s = sessionsCache.get(viewedSessionId);
        let csv = "﻿م,اسم الطالب,النوع,وقت التسجيل\n";
        attRows.forEach(r => {
            csv += `${r.idx},${csvSafe(r.studentName)},${csvSafe(r.manual ? 'يدوي' : 'ذاتي')},${csvSafe(fmtTime(r.timestamp))}\n`;
        });
        const url = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
        const a = document.createElement('a');
        a.href = url;
        a.download = `attendance_${(s ? s.subject : 'session').replace(/[^\w؀-ۿ]+/g, '_')}_${Date.now()}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ---------- السجل ----------
    async function loadLogs(uid, label) {
        viewedLogsUid = uid;
        logsDirty = false;
        $('logs-title').textContent = uid === me.uid ? "سجل نشاطي" : `سجل نشاط: ${label || uid}`;
        $('logs-title').dataset.label = label || '';
        const box = $('logs-list');
        try {
            const snap = await getDocs(query(collection(db, "admins", uid, "logs"), orderBy("timestamp", "desc"), limit(40)));
            if (snap.empty) { setEmpty(box, "لا يوجد نشاط مسجل"); return; }
            const frag = document.createDocumentFragment();
            snap.forEach(d => {
                const l = d.data({ serverTimestamps:'estimate' });
                const row = el('div', 'row');
                row.style.gridTemplateColumns = '1fr';
                const main = el('div', 'main');
                main.appendChild(el('div', 'name', l.action));
                main.appendChild(el('div', 'meta', fmtTime(l.timestamp)));
                row.appendChild(main);
                frag.appendChild(row);
            });
            box.replaceChildren(frag);
        } catch (e) { console.error(e); setEmpty(box, "تعذّر تحميل السجل"); }
    }

    // ---------- المشرفون ----------
    async function loadAdmins() {
        const box = $('admins-list');
        try {
            const snap = await getDocs(collection(db, "admins"));
            const frag = document.createDocumentFragment();
            snap.forEach(d => {
                const a = d.data();
                const row = el('div', 'row');
                row.appendChild(el('div', 'n', a.role === 'super' ? '★' : '•'));
                const main = el('div', 'main');
                main.appendChild(el('div', 'name', a.name || a.email || d.id));
                main.appendChild(el('div', 'meta', `${a.role === 'super' ? 'مشرف عام' : 'مشرف'} — ${a.specialization || 'بدون تخصص'}${a.email ? ' — ' + a.email : ''}`));
                row.appendChild(main);

                const acts = el('div', 'acts');
                acts.appendChild(smallBtn("سجله", "btn-ghost", () => { loadLogs(d.id, a.name || a.email); setTab('logs'); }));
                if (d.id !== me.uid) acts.appendChild(smallBtn("إزالة", "btn-danger", () => removeAdmin(d.id, a)));
                row.appendChild(acts);
                frag.appendChild(row);
            });
            box.replaceChildren(frag);
        } catch (e) { console.error(e); setEmpty(box, "تعذّر تحميل المشرفين"); }
    }

    async function removeAdmin(uid, a) {
        if (!confirm(`إزالة صلاحية ${a.name || a.email}؟ سيبقى حسابه في Authentication لكنه لن يدخل اللوحة.`)) return;
        try {
            await deleteDoc(doc(db, "admins", uid));
            logAction(`إزالة مشرف: ${a.name || a.email}`);
            loadAdmins();
            toast("تمت الإزالة", "ok");
        } catch (e) { console.error(e); toast("تعذّرت الإزالة", "err"); }
    }

    async function addAdmin() {
        const name = $('new-admin-name').value.trim();
        const email = $('new-admin-email').value.trim();
        const password = $('new-admin-pass').value;
        const specialization = $('new-admin-spec').value;
        const role = $('new-admin-role').value;
        if (!name || !email || password.length < 6) return toast("أكمل الاسم والبريد وكلمة مرور من 6 أحرف", "err");

        await busy($('add-admin-btn'), async () => {
            try {
                const secApp = initializeApp(firebaseConfig, 'secondary-' + Date.now());
                const secAuth = getAuth(secApp);
                const cred = await createUserWithEmailAndPassword(secAuth, email, password);
                await signOut(secAuth);
                await setDoc(doc(db, "admins", cred.user.uid), { name, email, role, specialization, createdBy:me.uid });
                logAction(`إضافة مشرف: ${name}`);
                ['new-admin-name', 'new-admin-email', 'new-admin-pass'].forEach(id => $(id).value = "");
                toast("تم إنشاء المشرف ✓", "ok");
                loadAdmins();
            } catch (e) {
                console.error(e);
                if (e.code === 'auth/email-already-in-use') toast("البريد مسجّل مسبقاً. أنشئ له مستنداً في admins يدوياً بالـ UID", "err");
                else if (e.code === 'auth/weak-password') toast("كلمة المرور ضعيفة", "err");
                else toast("تعذّر الإنشاء: " + (e.code || e.message), "err");
            }
        });
    }

    // ---------- ربط الأحداث ----------
    $('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab); });
    $('logout-btn').addEventListener('click', logoutAdmin);
    $('save-profile-btn').addEventListener('click', saveProfile);
    $('create-btn').addEventListener('click', createSession);
    $('subject-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') createSession(); });
    $('close-btn').addEventListener('click', closeSession);
    $('hide-qr-btn').addEventListener('click', hideQR);
    $('full-btn').addEventListener('click', toggleFull);
    $('resume-btn').addEventListener('click', resumeQR);
    $('session-selector').addEventListener('change', onSessionChange);
    $('export-btn').addEventListener('click', exportToExcel);
    $('manual-add-btn').addEventListener('click', addManual);
    $('manual-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') addManual(); });
    $('att-search').addEventListener('input', renderAttendance);
    $('delete-session-btn').addEventListener('click', deleteSession);
    $('add-admin-btn').addEventListener('click', addAdmin);
</script>

</body>
</html>
