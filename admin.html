<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>لوحة التحكم - إدارة الحضور</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --primary:#4f46e5; --primary-hover:#4338ca; --success:#16a34a; --danger:#dc2626; --bg:#f8fafc; --card-bg:#fff; --text:#1e293b; --gray:#64748b; --border:#e2e8f0; }
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:var(--bg); margin:0; padding:20px; color:var(--text); }
        .container { max-width:750px; margin:auto; background:var(--card-bg); padding:30px; border-radius:16px; box-shadow:0 10px 25px -5px rgba(0,0,0,.05); }
        .header-bar { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--border); padding-bottom:15px; margin-bottom:25px; }
        .section { background:#fbfcfe; border:1px solid var(--border); padding:20px; border-radius:12px; margin-bottom:20px; }
        input, select { width:100%; padding:10px 14px; font-size:15px; border-radius:8px; border:1px solid #cbd5e1; box-sizing:border-box; margin-bottom:10px; outline:none; }
        button { padding:10px 18px; font-size:15px; font-weight:600; border-radius:8px; border:none; background:var(--primary); color:#fff; cursor:pointer; width:100%; }
        button:hover { background:var(--primary-hover); }
        .btn-danger { background:var(--danger); width:auto; padding:8px 16px; }
        .btn-danger:hover { background:#b91c1c; }
        .btn-success { background:var(--success); }
        #qrcode { margin:15px auto; display:flex; justify-content:center; background:#fff; padding:10px; border-radius:8px; width:fit-content; box-shadow:0 4px 6px -1px rgba(0,0,0,.05); }
        table { width:100%; border-collapse:collapse; margin-top:15px; background:#fff; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
        th, td { border:1px solid var(--border); padding:10px 12px; text-align:center; font-size:14px; }
        th { background:#f1f5f9; }
        .muted { color:var(--gray); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h2>لوحة التحكم (حماية QR متحرك)</h2>
        <button class="btn-danger" id="logout-btn">تسجيل الخروج</button>
    </div>

    <div class="section">
        <h3>1. فتح جلسة حضور جديدة</h3>
        <input type="text" id="subject-name" placeholder="اسم المحاضرة (مثال: كيمياء تحليلية)" maxlength="80">
        <button id="create-btn">بدء الجلسة وتفعيل الـ QR المتحرك</button>
    </div>

    <div class="section" id="qr-section" style="display:none; text-align:center;">
        <h3>2. رمز الاستجابة السريع (متغير لمنع التزييف)</h3>
        <p class="muted" style="font-size:13px;">يتحدث الـ QR تلقائياً كل 20 ثانية. اعرضه على الشاشة داخل القاعة فقط.</p>
        <div id="qrcode"></div>
        <p id="timer-display" style="font-weight:bold; color:var(--primary); margin-top:5px;"></p>
        <button class="btn-danger" id="close-btn" style="width:100%;">إغلاق الجلسة الآن</button>
    </div>

    <div class="section">
        <h3>3. سجل الحضور اللحظي</h3>
        <select id="session-selector">
            <option value="">-- اختر الجلسة لعرض الحضور --</option>
        </select>

        <button id="export-btn" class="btn-success" style="display:none; margin-top:10px;">تصدير الحضور إلى Excel</button>

        <table>
            <thead>
                <tr><th>م</th><th>اسم الطالب</th><th>وقت التسجيل</th></tr>
            </thead>
            <tbody id="attendance-list">
                <tr><td colspan="3" class="muted">اختر جلسة لعرض الحضور</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDoc, getDocs, setDoc, query, where, orderBy, limit, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR_8fKmcHa3KDxt4AIt2ZMQ59UDMrZlDE",
        authDomain: "mnu-attendance.firebaseapp.com",
        databaseURL: "https://mnu-attendance-default-rtdb.firebaseio.com",
        projectId: "mnu-attendance",
        storageBucket: "mnu-attendance.firebasestorage.app",
        messagingSenderId: "768022025822",
        appId: "1:768022025822:web:af7c6dc6a36bc07adf06cf",
        measurementId: "G-R955LS94GJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let qrInterval = null;
    let timerInterval = null;
    let unsubscribeAttendance = null;
    let currentSessionId = null;
    let currentAttendanceData = [];

    const $ = (id) => document.getElementById(id);

    function newToken() {
        const a = new Uint32Array(3);
        crypto.getRandomValues(a);
        return Array.from(a, n => n.toString(36)).join('').slice(0, 12);
    }

    function stopQR() {
        if (qrInterval) clearInterval(qrInterval);
        if (timerInterval) clearInterval(timerInterval);
        qrInterval = timerInterval = null;
    }

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = "index.html"; return; }
        try {
            const snap = await getDoc(doc(db, "admins", user.uid));
            if (!snap.exists()) {
                await signOut(auth);
                window.location.href = "index.html";
                return;
            }
            loadSessionsList();
        } catch (e) {
            console.error(e);
            window.location.href = "index.html";
        }
    });

    async function logoutAdmin() {
        stopQR();
        if (unsubscribeAttendance) unsubscribeAttendance();
        await signOut(auth);
        window.location.href = "index.html";
    }

    async function createSession() {
        const subject = $('subject-name').value.trim();
        if (!subject) { alert("الرجاء إدخال اسم المادة!"); return; }

        try {
            const now = Date.now();
            const docRef = await addDoc(collection(db, "sessions"), {
                subject: subject,
                createdAt: now,
                expiresAt: now + 45 * 60 * 1000,
                active: true,
                createdBy: auth.currentUser.uid
            });

            currentSessionId = docRef.id;
            // الرمز الأول: لا يوجد سابق
            const first = newToken();
            await setDoc(doc(db, "sessions", currentSessionId, "private", "code"), { current: first, previous: first });

            $('qr-section').style.display = 'block';
            startDynamicQR(currentSessionId, first);
            await loadSessionsList();
            $('session-selector').value = currentSessionId;
            loadAttendance();
        } catch (error) {
            console.error(error);
            alert("حدث خطأ أثناء إنشاء الجلسة. تأكد أنك مضاف كمشرف وأن القواعد منشورة.");
        }
    }

    function drawQR(sessionId, token) {
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const url = `${baseUrl}/student.html?session=${encodeURIComponent(sessionId)}&token=${encodeURIComponent(token)}`;
        $('qrcode').innerHTML = "";
        new QRCode($('qrcode'), { text: url, width: 220, height: 220 });
    }

    function startDynamicQR(sessionId, firstToken) {
        stopQR();
        let current = firstToken;
        let timeLeft = 20;

        drawQR(sessionId, current);

        timerInterval = setInterval(() => {
            timeLeft = Math.max(0, timeLeft - 1);
            $('timer-display').textContent = `يتغير الرمز خلال: ${timeLeft} ثانية`;
        }, 1000);

        qrInterval = setInterval(async () => {
            const previous = current;
            const next = newToken();
            try {
                // نُبقي الرمز السابق صالحاً لفترة سماح حتى لا يفشل من مسح الرمز لحظة التحديث
                await setDoc(doc(db, "sessions", sessionId, "private", "code"), { current: next, previous: previous });
                current = next;
                drawQR(sessionId, current);
                timeLeft = 20;
            } catch (e) {
                console.error("token update failed", e);
            }
        }, 20000);
    }

    async function closeSession() {
        if (!currentSessionId) return;
        if (!confirm("هل تريد إغلاق الجلسة نهائياً؟")) return;
        stopQR();
        try {
            await updateDoc(doc(db, "sessions", currentSessionId), { active: false });
            $('qr-section').style.display = 'none';
            $('qrcode').innerHTML = "";
        } catch (e) {
            console.error(e);
            alert("تعذّر إغلاق الجلسة.");
        }
    }

    async function loadSessionsList() {
        const selector = $('session-selector');
        selector.innerHTML = '<option value="">-- اختر الجلسة لعرض الحضور --</option>';

        const snap = await getDocs(query(collection(db, "sessions"), orderBy("createdAt", "desc"), limit(50)));
        snap.forEach((docSnap) => {
            const data = docSnap.data();
            const opt = document.createElement('option');
            opt.value = docSnap.id;
            opt.textContent = `${data.subject} (${new Date(data.createdAt).toLocaleDateString('ar-EG')})`;
            selector.appendChild(opt);
        });
    }

    function formatTime(ts) {
        const d = ts && ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleTimeString('ar-EG');
    }

    function loadAttendance() {
        const sessionId = $('session-selector').value;
        const tbody = $('attendance-list');
        const exportBtn = $('export-btn');

        if (unsubscribeAttendance) { unsubscribeAttendance(); unsubscribeAttendance = null; }
        tbody.replaceChildren();
        currentAttendanceData = [];

        function messageRow(text) {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 3; td.className = 'muted'; td.textContent = text;
            tr.appendChild(td); tbody.appendChild(tr);
        }

        if (!sessionId) { messageRow("اختر جلسة لعرض الحضور"); exportBtn.style.display = 'none'; return; }

        exportBtn.style.display = 'block';
        const q = query(collection(db, "attendance"), where("sessionId", "==", sessionId));
        unsubscribeAttendance = onSnapshot(q, (snapshot) => {
            tbody.replaceChildren();
            currentAttendanceData = [];

            if (snapshot.empty) { messageRow("لا يوجد حضور مسجل حتى الآن"); return; }

            const rows = snapshot.docs.map(d => d.data())
                .sort((a, b) => (a.timestamp?.toMillis?.() ?? 0) - (b.timestamp?.toMillis?.() ?? 0));

            rows.forEach((att, idx) => {
                const timeStr = formatTime(att.timestamp);
                currentAttendanceData.push({ index: idx + 1, name: att.studentName, time: timeStr });

                const tr = document.createElement('tr');
                [idx + 1, att.studentName, timeStr].forEach(val => {
                    const td = document.createElement('td');
                    td.textContent = val;   // textContent يمنع XSS
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }, (err) => { console.error(err); messageRow("تعذّر تحميل الحضور (تحقق من صلاحيات المشرف)."); });
    }

    function csvSafe(value) {
        let s = String(value).replace(/"/g, '""');
        if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;   // منع حقن الصيغ في Excel
        return `"${s}"`;
    }

    function exportToExcel() {
        if (currentAttendanceData.length === 0) return alert("لا توجد بيانات لتصديرها!");
        let csv = "﻿م,اسم الطالب,وقت التسجيل\n";
        currentAttendanceData.forEach(r => { csv += `${r.index},${csvSafe(r.name)},${csvSafe(r.time)}\n`; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `attendance_${Date.now()}.csv`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    $('logout-btn').addEventListener('click', logoutAdmin);
    $('create-btn').addEventListener('click', createSession);
    $('close-btn').addEventListener('click', closeSession);
    $('session-selector').addEventListener('change', loadAttendance);
    $('export-btn').addEventListener('click', exportToExcel);
</script>

</body>
</html>
