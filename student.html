<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل الحضور الآمن</title>
    <style>
        :root { --primary:#4f46e5; --success:#16a34a; --danger:#dc2626; --warning:#d97706; --bg:#f8fafc; --card-bg:#fff; --text:#1e293b; --gray:#64748b; }
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:var(--bg); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; color:var(--text); padding:15px; box-sizing:border-box; }
        .card { background:var(--card-bg); padding:40px 30px; border-radius:16px; width:100%; max-width:400px; box-shadow:0 10px 25px -5px rgba(0,0,0,.05); text-align:center; }
        .card h2 { margin-top:0; color:var(--primary); font-size:22px; }
        #session-info { color:var(--gray); font-size:15px; margin-bottom:25px; font-weight:600; }
        .input-group { text-align:right; margin-bottom:15px; }
        .input-group label { display:block; margin-bottom:5px; font-size:14px; color:var(--gray); font-weight:600; }
        input[type="text"] { width:100%; padding:12px 15px; font-size:15px; border-radius:8px; border:1px solid #cbd5e1; box-sizing:border-box; outline:none; }
        input[type="text"]:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.1); }
        button { width:100%; padding:12px; margin-top:10px; font-size:16px; font-weight:600; border-radius:8px; border:none; background:var(--success); color:#fff; cursor:pointer; }
        button:hover { background:#15803d; }
        button:disabled { opacity:.6; cursor:default; }
        #msg { margin-top:20px; font-size:15px; font-weight:600; }
    </style>
</head>
<body>

<div class="card">
    <h2>تسجيل الحضور الآمن</h2>
    <p id="session-info">جاري التحقق من الجلسة...</p>

    <div id="form-container" style="display:none;">
        <div class="input-group">
            <label for="student-name">اكتب اسمك الثلاثي:</label>
            <input type="text" id="student-name" placeholder="مثال: جمال زكريا السيد" maxlength="80" autocomplete="name">
        </div>
        <button id="submit-btn">تأكيد الحضور</button>
    </div>
    <p id="msg"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAR_8fKmcHa3KDxt4AIt2ZMQ59UDMrZlDE",
        authDomain: "mnu-attendance.firebaseapp.com",
        databaseURL: "https://mnu-attendance-default-rtdb.firebaseio.com",
        projectId: "mnu-attendance",
        storageBucket: "mnu-attendance.firebasestorage.app",
        messagingSenderId: "768022025822",
        appId: "1:768022025822:web:af7c6dc6a36bc07adf06cf",
        measurementId: "G-R955LS94GJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');
    const token = params.get('token');

    const info = document.getElementById('session-info');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');

    function show(text, color) { msg.style.color = color; msg.textContent = text; }

    async function initPage() {
        if (!sessionId || !token) {
            info.textContent = "خطأ: رابط الـ QR غير صالح. امسح الرمز من الشاشة مرة أخرى.";
            return;
        }
        try {
            await signInAnonymously(auth);

            const sessionSnap = await getDoc(doc(db, "sessions", sessionId));
            if (!sessionSnap.exists()) { info.textContent = "هذه الجلسة غير موجودة."; return; }

            const s = sessionSnap.data();
            if (!s.active || Date.now() > s.expiresAt) {
                info.textContent = "عذراً، انتهت جلسة الحضور أو تم إغلاقها.";
                return;
            }

            // هل سجّل هذا الجهاز مسبقاً؟
            const prev = await getDoc(doc(db, "attendance", `${sessionId}_${auth.currentUser.uid}`));
            if (prev.exists()) {
                info.textContent = `المادة: ${s.subject}`;
                show("لقد قمت بتسجيل الحضور مسبقاً من هذا الجهاز ✅", "var(--warning)");
                return;
            }

            info.textContent = `المادة: ${s.subject}`;
            document.getElementById('form-container').style.display = 'block';
        } catch (e) {
            console.error(e);
            info.textContent = "تعذّر الاتصال. تأكد من الإنترنت وأعد مسح الرمز.";
        }
    }

    async function submitAttendance() {
        const studentName = document.getElementById('student-name').value.trim().replace(/\s+/g, ' ');

        if (studentName.split(' ').length < 3 || studentName.length < 6) {
            show("الرجاء كتابة اسمك الثلاثي بشكل صحيح!", "var(--danger)");
            return;
        }

        btn.disabled = true;
        try {
            const uid = auth.currentUser.uid;
            // التحقق من صحة التوكن يتم في قواعد Firestore على الخادم
            await setDoc(doc(db, "attendance", `${sessionId}_${uid}`), {
                sessionId: sessionId,
                studentName: studentName,
                token: token,
                timestamp: serverTimestamp()
            });

            show("تم تسجيل حضورك بنجاح! ✅", "var(--success)");
            document.getElementById('form-container').style.display = 'none';

        } catch (error) {
            console.error(error);
            if (error.code === 'permission-denied') {
                show("الرمز منتهي أو الجلسة مغلقة، أو سجّلت مسبقاً. امسح الرمز الظاهر حالياً على الشاشة.", "var(--danger)");
            } else {
                show("حدث خطأ أثناء التسجيل، حاول مرة أخرى.", "var(--danger)");
            }
            btn.disabled = false;
        }
    }

    btn.addEventListener('click', submitAttendance);
    initPage();
</script>

</body>
</html>
