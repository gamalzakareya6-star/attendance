<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f46e5">
    <title>تسجيل الحضور</title>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
    <style>
        :root { --primary:#4f46e5; --primary-soft:#eef2ff; --success:#16a34a; --success-soft:#dcfce7; --danger:#dc2626; --danger-soft:#fee2e2; --warning:#d97706; --warning-soft:#fef3c7; --bg:#f1f5f9; --card:#fff; --text:#0f172a; --gray:#64748b; --border:#e2e8f0; --input:#f8fafc; }
        @media (prefers-color-scheme: dark) {
            :root { --primary:#818cf8; --primary-soft:#1e1b4b; --success:#4ade80; --success-soft:#052e16; --danger:#f87171; --danger-soft:#450a0a; --warning:#fbbf24; --warning-soft:#451a03; --bg:#0b1020; --card:#151b2e; --text:#e5e7eb; --gray:#94a3b8; --border:#27304a; --input:#0f1424; }
        }
        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--text); margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:16px; font-size:17px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:20px; width:100%; max-width:420px; padding:28px 22px; text-align:center; box-shadow:0 12px 30px -14px rgba(15,23,42,.25); }
        .logo { width:64px; height:64px; margin:0 auto 12px; border-radius:20px; background:var(--primary-soft); display:grid; place-items:center; font-size:32px; }
        h1 { font-size:20px; margin:0 0 6px; }
        .subject { display:inline-block; background:var(--primary-soft); color:var(--primary); font-weight:700; padding:6px 16px; border-radius:30px; margin:6px 0 18px; font-size:15px; min-height:32px; }
        .subject.wait { color:transparent; width:150px; animation:pulse 1s infinite; }
        @keyframes pulse { 50% { opacity:.4; } }
        .status { color:var(--gray); font-weight:600; }
        label { display:block; text-align:right; font-size:14px; color:var(--gray); font-weight:600; margin-bottom:6px; }
        input { width:100%; min-height:54px; padding:12px 16px; font-size:18px; border-radius:14px; border:1.5px solid var(--border); background:var(--input); color:var(--text); outline:none; font-family:inherit; }
        input:focus { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
        button { width:100%; min-height:56px; margin-top:14px; font-size:18px; font-weight:800; border-radius:14px; border:none; background:var(--success); color:#052e16; cursor:pointer; font-family:inherit; }
        button:active { transform:scale(.98); }
        button:disabled { opacity:.55; }
        .msg { margin-top:16px; padding:12px 14px; border-radius:12px; font-weight:700; font-size:15px; display:none; }
        .msg.show { display:block; }
        .msg.ok { background:var(--success-soft); color:var(--success); }
        .msg.err { background:var(--danger-soft); color:var(--danger); }
        .msg.warn { background:var(--warning-soft); color:var(--warning); }
        .done { font-size:64px; animation:pop .4s ease; }
        @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }
        .hidden { display:none !important; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">📋</div>
    <h1>تسجيل الحضور</h1>
    <div class="subject wait" id="subject">...</div>

    <div id="form-container">
        <label for="student-name">اكتب اسمك الثلاثي</label>
        <input type="text" id="student-name" placeholder="مثال: جمال زكريا السيد" maxlength="80" autocomplete="name" enterkeyhint="done">
        <button id="submit-btn">تأكيد الحضور</button>
    </div>

    <div id="success" class="hidden">
        <div class="done">✅</div>
        <div class="status" style="color:var(--success); font-size:18px;">تم تسجيل حضورك</div>
    </div>

    <div class="msg" id="msg"></div>
</div>

<!-- بدون مكتبة Firebase: طلبات fetch مباشرة إلى واجهات Google (REST) -->
<script>
(function () {
    "use strict";

    var API_KEY = "AIzaSyAR_8fKmcHa3KDxt4AIt2ZMQ59UDMrZlDE";
    var PROJECT = "mnu-attendance";
    var DOCS = "https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents";
    var AUTH_KEY = "att_auth_v1";

    var params = new URLSearchParams(location.search);
    var sessionId = params.get("session");
    var token = params.get("token");

    var $ = function (id) { return document.getElementById(id); };
    var btn = $("submit-btn");

    function show(text, kind) { var m = $("msg"); m.textContent = text; m.className = "msg show " + kind; }
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

    function fatal(text) {
        $("form-container").classList.add("hidden");
        $("subject").classList.add("hidden");
        show(text, "err");
    }

    // ---------- الدخول المجهول (مع تخزين الجلسة لتجنّب طلب جديد) ----------
    function saveAuth(o) {
        var a = { idToken: o.idToken, refresh: o.refresh, uid: o.uid, exp: Date.now() + Number(o.expiresIn || 3600) * 1000 };
        lsSet(AUTH_KEY, JSON.stringify(a));
        return a;
    }

    function getAuth(forceNew) {
        var c = null;
        if (!forceNew) { try { c = JSON.parse(lsGet(AUTH_KEY) || "null"); } catch (e) {} }

        if (c && c.exp > Date.now() + 60000) return Promise.resolve(c);          // صالح: لا طلب شبكة

        function signUp() {
            return fetch("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=" + API_KEY, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ returnSecureToken: true })
            }).then(function (r) {
                if (!r.ok) throw new Error("auth");
                return r.json();
            }).then(function (j) {
                return saveAuth({ idToken: j.idToken, refresh: j.refreshToken, uid: j.localId, expiresIn: j.expiresIn });
            });
        }

        if (c && c.refresh) {                                                      // منتهٍ: جدّده بنفس الـ UID
            return fetch("https://securetoken.googleapis.com/v1/token?key=" + API_KEY, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(c.refresh)
            }).then(function (r) {
                if (!r.ok) throw new Error("refresh");
                return r.json();
            }).then(function (j) {
                return saveAuth({ idToken: j.id_token, refresh: j.refresh_token, uid: j.user_id, expiresIn: j.expires_in });
            }).catch(signUp);
        }
        return signUp();
    }

    // ---------- ابدأ كل شيء فوراً وبالتوازي ----------
    var authP = getAuth(false);
    authP.catch(function () {});

    var sessionP = (!sessionId || !token) ? Promise.resolve(null) :
        fetch(DOCS + "/sessions/" + encodeURIComponent(sessionId) + "?key=" + API_KEY)   // القراءة مسموحة بدون تسجيل دخول
            .then(function (r) { return r.status === 404 ? { missing: true } : r.json(); });

    function num(f) { return f ? Number(f.integerValue != null ? f.integerValue : f.doubleValue) : 0; }

    if (!sessionId || !token) {
        fatal("رابط غير صالح. امسح الـ QR من الشاشة مرة أخرى.");
    } else {
        try { var saved = lsGet("student_name"); if (saved) $("student-name").value = saved; } catch (e) {}
        if (!$("student-name").value) $("student-name").focus();

        // النموذج ظاهر من اللحظة الأولى؛ نتحقق من الجلسة في الخلفية
        sessionP.then(function (j) {
            if (!j || j.missing || !j.fields) { fatal("هذه الجلسة غير موجودة."); return; }
            var f = j.fields;
            var active = f.active && f.active.booleanValue === true;
            if (!active || Date.now() > num(f.expiresAt)) { fatal("انتهت جلسة الحضور أو أُغلقت."); return; }

            var s = $("subject");
            s.classList.remove("wait");
            s.textContent = (f.subject ? f.subject.stringValue : "") + (f.specialization && f.specialization.stringValue ? " — " + f.specialization.stringValue : "");

            // هل سجّل هذا الجهاز مسبقاً؟ (لا يؤخر شيئاً)
            return authP.then(function (a) {
                return fetch(DOCS + "/attendance/" + encodeURIComponent(sessionId + "_" + a.uid) + "?key=" + API_KEY, {
                    headers: { Authorization: "Bearer " + a.idToken }
                });
            }).then(function (r) {
                if (r && r.status === 200) {
                    $("form-container").classList.add("hidden");
                    $("success").classList.remove("hidden");
                    show("سجّلت حضورك مسبقاً في هذه الجلسة", "warn");
                }
            });
        }).catch(function () {
            fatal("تعذّر الاتصال. تأكد من الإنترنت وأعد مسح الرمز.");
        });
    }

    // ---------- تسجيل الحضور: طلب واحد (commit) ----------
    function commit(a, name) {
        var docName = "projects/" + PROJECT + "/databases/(default)/documents/attendance/" + sessionId + "_" + a.uid;
        return fetch("https://firestore.googleapis.com/v1/projects/" + PROJECT + "/databases/(default)/documents:commit?key=" + API_KEY, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + a.idToken },
            body: JSON.stringify({
                writes: [{
                    update: {
                        name: docName,
                        fields: {
                            sessionId: { stringValue: sessionId },
                            studentName: { stringValue: name },
                            token: { stringValue: token }
                        }
                    },
                    updateTransforms: [{ fieldPath: "timestamp", setToServerValue: "REQUEST_TIME" }],
                    currentDocument: { exists: false }      // يمنع التسجيل المكرر
                }]
            })
        });
    }

    function submit() {
        var name = $("student-name").value.trim().replace(/\s+/g, " ");
        if (name.split(" ").length < 3 || name.length < 6) { show("اكتب اسمك الثلاثي بشكل صحيح", "err"); return; }

        btn.disabled = true;
        btn.textContent = "جاري التسجيل...";

        function done() {
            lsSet("student_name", name);
            $("msg").className = "msg";
            $("form-container").classList.add("hidden");
            $("success").classList.remove("hidden");
            if (navigator.vibrate) navigator.vibrate(60);
        }
        function reset() { btn.disabled = false; btn.textContent = "تأكيد الحضور"; }

        function attempt(retried) {
            return authP.then(function (a) {
                return commit(a, name).then(function (r) {
                    if (r.ok) { done(); return; }
                    if (r.status === 401 && !retried) {                   // انتهى التوكن: جدّد وأعد المحاولة مرة
                        lsDel(AUTH_KEY);
                        authP = getAuth(true);
                        return attempt(true);
                    }
                    return r.json().catch(function () { return {}; }).then(function (j) {
                        var st = j && j.error && j.error.status;
                        if (st === "ALREADY_EXISTS" || r.status === 409) {
                            $("form-container").classList.add("hidden");
                            $("success").classList.remove("hidden");
                            show("سجّلت حضورك مسبقاً في هذه الجلسة", "warn");
                        } else if (st === "PERMISSION_DENIED" || r.status === 403) {
                            show("الرمز انتهى أو الجلسة أُغلقت. امسح الرمز الظاهر حالياً على الشاشة.", "err");
                            reset();
                        } else {
                            show("حدث خطأ أثناء التسجيل، حاول مرة أخرى.", "err");
                            reset();
                        }
                    });
                });
            });
        }

        attempt(false).catch(function () {
            show("تعذّر الاتصال. تأكد من الإنترنت وحاول مرة أخرى.", "err");
            reset();
        });
    }

    btn.addEventListener("click", submit);
    $("student-name").addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
})();
</script>

</body>
</html>
