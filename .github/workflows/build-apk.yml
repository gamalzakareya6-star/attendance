name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'admin-app/**'
      - 'admin.html'
      - 'index.html'
      - 'catalog.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  student:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Add QR decoder and course catalog to the app
        run: |
          cp node_modules/jsqr/dist/jsQR.js www/jsQR.js
          cp ../catalog.json www/catalog.json
          echo '{"build": ${{ github.run_number }}}' > www/version.json

      - name: Create Android project
        run: npx cap add android

      - name: Use the fixed signing key
        # مفتاح توقيع ثابت: يمنع تغيّر معرّف الجهاز مع كل بناء ويسمح بالتحديث فوق النسخة القديمة
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Camera permission, no backup, rising version number
        run: |
          sed -i "s/versionCode 1/versionCode $((${{ github.run_number }} + 100))/" android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          sed -i 's#android:allowBackup="true"#android:allowBackup="false"#' "$M"
          # رابط mnuattendance:// لفتح التطبيق وربط بيانات المتصفح
          sed -i '0,/<\/activity>/s#</activity>#<intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="mnuattendance" android:host="link" />\n            </intent-filter>\n        </activity>#' "$M"
          grep -n "CAMERA\|allowBackup\|versionCode" "$M" android/app/build.gradle

      - name: Force the fixed signing key in Gradle
        run: |
          sed -i '0,/^android {/s##android {\n    signingConfigs {\n        debug {\n            storeFile file("$rootDir/../debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }#' android/app/build.gradle
          grep -n -A8 "signingConfigs" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify the APK is signed with the fixed key
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile "$APK" | grep SHA256
          keytool -printcert -jarfile "$APK" | grep -q "6C:2F:E7:0A:7C:A9:49:7A:C9:10:06:8F:B9:77:32:8E:C0:DE:B2:77:01:2C:B9:8B:99:5F:62:02:89:5F:A6:5A" || { echo "WRONG SIGNING KEY"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: student-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Copy the admin pages from the website
        # الصفحات نفسها المستخدمة على الموقع: تعديل واحد يظهر في الموقع والتطبيق
        run: |
          mkdir -p www
          cp ../index.html ../admin.html ../catalog.json www/

      - name: Create Android project
        run: npx cap add android

      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp ../app/debug.keystore ~/.android/debug.keystore

      - name: Rising version number
        run: sed -i "s/versionCode 1/versionCode $((${{ github.run_number }} + 100))/" android/app/build.gradle

      - name: Force the fixed signing key in Gradle
        run: |
          sed -i '0,/^android {/s##android {\n    signingConfigs {\n        debug {\n            storeFile file("$rootDir/../../app/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }#' android/app/build.gradle
          grep -n -A8 "signingConfigs" android/app/build.gradle

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: admin-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify the APK is signed with the fixed key
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          keytool -printcert -jarfile "$APK" | grep SHA256
          keytool -printcert -jarfile "$APK" | grep -q "6C:2F:E7:0A:7C:A9:49:7A:C9:10:06:8F:B9:77:32:8E:C0:DE:B2:77:01:2C:B9:8B:99:5F:62:02:89:5F:A6:5A" || { echo "WRONG SIGNING KEY"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: admin-apk
          path: admin-app/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [student, admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - name: Publish both APKs as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apks/student-apk/app-debug.apk attendance.apk
          cp apks/admin-apk/app-debug.apk attendance-admin.apk
          gh release create "v${{ github.run_number }}" attendance.apk attendance-admin.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Attendance apps v${{ github.run_number }}" \
            --notes "attendance.apk = تطبيق الطالب, attendance-admin.apk = تطبيق المشرف (debug builds)" --latest
