name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Add QR decoder to the app
        run: cp node_modules/jsqr/dist/jsQR.js www/jsQR.js

      - name: Create Android project
        run: npx cap add android

      - name: Use the fixed signing key
        # مفتاح توقيع ثابت: يمنع تغيّر معرّف الجهاز مع كل بناء ويسمح بالتحديث فوق النسخة القديمة
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Camera permission, no backup, rising version number
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$M"
          sed -i 's#android:allowBackup="true"#android:allowBackup="false"#' "$M"
          grep -n "CAMERA\|allowBackup" "$M"

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release (public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk attendance.apk
          gh release create "v${{ github.run_number }}" attendance.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Attendance app v${{ github.run_number }}" \
            --notes "Debug build" --latest
